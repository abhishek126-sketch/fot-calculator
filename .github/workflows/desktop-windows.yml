name: Desktop Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Unit tests
        working-directory: desktop
        run: npm test

      - name: Build NSIS installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify PE + SHA-256
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "FOT-Calculator-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installer not found" }
          Write-Host "Artifact:" $exe.FullName $exe.Length
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)[0..1]
          if (-not ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A)) { throw "Not a PE MZ executable" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $shaFile = "$($exe.FullName).sha256"
          Set-Content -Path $shaFile -Value "$hash  $($exe.Name)`n" -NoNewline
          # Also write companion for release naming
          Copy-Item $shaFile "dist/$($exe.BaseName).sha256"
          Write-Host "SHA256 $hash"
          Write-Host "MZ header OK"

      - name: Smoke — licence + users + folder
        working-directory: desktop
        shell: pwsh
        run: |
          node --test tests/licence.test.js tests/users.test.js tests/paths.test.js tests/updates.test.js
          $tmp = Join-Path $env:TEMP "fot-reports-smoke-v11"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $rec = '{"id":"t_smoke_1","ptId":"SMOKE","ptName":"Smoke","testDate":"2026-11-07","updatedAt":"2026-11-07T00:00:00.000Z","measured":{"r5":4.2}}'
          Set-Content -Path (Join-Path $tmp "SMOKE_2026-11-07_t_smoke_1.json") -Value $rec -Encoding UTF8
          if (-not (Test-Path (Join-Path $tmp "SMOKE_2026-11-07_t_smoke_1.json"))) { throw "JSON missing" }
          Write-Host "Folder smoke OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOT-Calculator-Setup
          path: |
            desktop/dist/FOT-Calculator-Setup-*.exe
            desktop/dist/FOT-Calculator-Setup-*.sha256

      - name: Read version
        id: ver
        working-directory: desktop
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: FOT Calculator Desktop v${{ steps.ver.outputs.version }}
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Offline Windows x64 installer (NSIS, per-user under Documents\FOT Calculator\App, unsigned).

            **v1.2.0**
            - Spirometry: GLI Global 2022 (race-neutral) predicted / LLN / z-scores for FEV1, FVC, FEV1/FVC; ATS/ERS 2022 interpretation (pattern, severity, bronchodilator response > 10% of predicted) with the GOLD post-BD fixed ratio; on screen, in PDF reports, saved tests and comparisons

            **v1.1.0**
            - 1-year Ed25519 licence keys (name-bound)
            - Multi-user logins (scrypt passwords; reports separated per user; not encrypted at rest)
            - On-demand updates from GitHub releases with SHA-256 check; Updates\YYYY-MM-DD_vX.Y.Z\; Share update folder
            - Reports folder: Google Drive My Drive\FOT Reports if present, else Documents\FOT Calculator\Reports

            Verify installer: `certutil -hashfile FOT-Calculator-Setup-${{ steps.ver.outputs.version }}.exe SHA256` against the `.sha256` asset.
          files: |
            desktop/dist/FOT-Calculator-Setup-*.exe
            desktop/dist/FOT-Calculator-Setup-*.sha256
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
